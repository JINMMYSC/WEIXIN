name: WeixinRebuild
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  WeixinRebuild:
    type: application
    platform: iOS
    sources: [App, Engine]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jinmmysc.weixinrebuild
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 键盘重建实验
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: RebuildKeyboard
        embed: true
  RebuildKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Engine]
    info:
      path: Configuration/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: 重建键盘
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrimaryLanguage: zh-Hans
            PrefersRightToLeft: false
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jinmmysc.weixinrebuild.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  HostTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jinmmysc.weixinrebuild.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WeixinRebuild
schemes:
  WeixinRebuild:
    build:
      targets:
        WeixinRebuild: all
    test:
      targets: [HostTests]
