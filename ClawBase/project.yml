name: ClawBase
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 15.1
    MARKETING_VERSION: 3.0.1
    CURRENT_PROJECT_VERSION: 2
    WT_APP_GROUP_ID: group.7518554
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ClawBaseHost:
    type: application
    platform: iOS
    deploymentTarget: "15.1"
    sources:
      - path: Host/AppDelegate.swift
      - path: Host/SceneDelegate.swift
      - path: ../iOSApp/WTSettingsAppView.swift
      - path: ../iOSShared/WTSemanticGlyph.swift
      - path: ../Sources/WeTypeReplicaCore
    dependencies:
      - target: HamsterKeyboard
        embed: true
    entitlements:
      path: Host/Host.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lgm.7517
        PRODUCT_NAME: ClawBaseHost
        INFOPLIST_FILE: Host/Info.plist
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": arm64
  HamsterKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.1"
    sources:
      - path: Keyboard/HamsterKeyboardInputViewController.swift
      - path: Keyboard/WTPhase2KeyboardRootView.swift
      - path: Keyboard/WTPhase3KeyboardSurface.swift
      - path: Keyboard/WTPhase3AdapterSmokeSession.swift
      - path: Keyboard/WTLibrimeRimeSession.swift
      - path: Keyboard/WTLibrimeBridge.m
      - path: Vendor/RimeSharedSupport
        type: folder
        buildPhase: resources
      - path: ../Sources/WeTypeReplicaCore
      - path: ../iOSShared/WTSemanticGlyph.swift
      - path: ../iOSOverlay
      - path: ../HamsterBridge
      - path: ../iOSServices
        excludes:
          - WTHostSpeechRecognitionService.swift
          - WTVoiceLiveActivityController.swift
    dependencies:
      - framework: Vendor/LibrimeKit/Frameworks/librime.xcframework
        embed: false
      - framework: Vendor/LibrimeKit/Frameworks/boost_atomic.xcframework
        embed: false
      - framework: Vendor/LibrimeKit/Frameworks/boost_filesystem.xcframework
        embed: false
      - framework: Vendor/LibrimeKit/Frameworks/boost_regex.xcframework
        embed: false
      - framework: Vendor/LibrimeKit/Frameworks/boost_system.xcframework
        embed: false
      - framework: Vendor/LibrimeKit/Frameworks/libglog.xcframework
        embed: false
      - framework: Vendor/LibrimeKit/Frameworks/libleveldb.xcframework
        embed: false
      - framework: Vendor/LibrimeKit/Frameworks/libmarisa.xcframework
        embed: false
      - framework: Vendor/LibrimeKit/Frameworks/libopencc.xcframework
        embed: false
      - framework: Vendor/LibrimeKit/Frameworks/libyaml-cpp.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: CoreFoundation.framework
    entitlements:
      path: Keyboard/Keyboard.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lgm.7517.123
        PRODUCT_NAME: HamsterKeyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/WTLibrimeBridge.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/LibrimeKit/Frameworks/librime.xcframework/ios-arm64/Headers"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": arm64
