# CLAW TALK Phase 3 public Rime schema: 26-key full pinyin.
# Dictionary source is the pinned public rime/rime-luna-pinyin revision staged by CI.
schema:
  schema_id: claw_pinyin26
  name: CLAW 全拼
  version: "0.1"

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, EN ]
  - name: zh_hans
    reset: 1
    states: [ 漢, 简 ]

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - simplifier@zh_hans
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: luna_pinyin
  prism: claw_pinyin26
  enable_user_dict: true

zh_hans:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: none
