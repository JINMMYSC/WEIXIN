# CLAW TALK Phase 3 public Rime schema: 9-key pinyin.
# The pinned public luna_pinyin dictionary keeps traditional source forms and is projected to
# T9 digits by the speller.  zh_hans performs the real OpenCC simplified conversion at runtime.
schema:
  schema_id: claw_pinyin9
  name: CLAW 九宫格
  version: "0.4"
  dependencies:
    - stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, EN ]
  - name: zh_hans
    reset: 1
    states: [ 漢, 简 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier@zh_hans
    - uniquifier

speller:
  alphabet: "23456789"
  initials: "23456789"
  delimiter: "1'"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: luna_pinyin
  prism: claw_pinyin9
  enable_user_dict: true
  enable_sentence: true
  preedit_format:
    - xlit/23456789/23456789/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]+[a-z]*|[a-z]+)$"

zh_hans:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: none
