# CLAW TALK Phase 3 public Rime schema: 9-key pinyin.
# The speller derives T9 digit spellings from the pinned Luna Pinyin dictionary.
schema:
  schema_id: claw_pinyin9
  name: CLAW 九宫格
  version: "0.2"

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, EN ]
  - name: zh_hans
    reset: 1
    states: [ 漢, 简 ]

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - simplifier@zh_hans
    - uniquifier

speller:
  alphabet: "23456789"
  initials: "23456789"
  delimiter: "1'"
  algebra:
    # Standard T9 transliteration: map every pinyin letter in a spelling to its keypad digit.
    # Using independent `derive/[abc]/2/` rules only generated one-letter substitutions and did
    # not produce complete spellings such as nihao -> 64426.
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/

translator:
  dictionary: luna_pinyin
  prism: claw_pinyin9
  enable_user_dict: true
  preedit_format:
    - xlit/23456789/23456789/

zh_hans:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: none
