# CLAW TALK Phase 3 public Rime schema: 9-key pinyin.
# The speller derives T9 digit spellings from the pinned Luna Pinyin dictionary.
schema:
  schema_id: claw_pinyin9
  name: CLAW 九宫格
  version: "0.1"

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, EN ]
  - name: zh_hans
    reset: 1
    states: [ 漢, 简 ]

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - simplifier@zh_hans
    - uniquifier

speller:
  alphabet: "987654321abcdefghijklmnopqrstuvwxyz"
  initials: "987654321abcdefghijklmnopqrstuvwxyz"
  delimiter: "1'"
  algebra:
    - derive/[abc]/2/
    - derive/[def]/3/
    - derive/[ghi]/4/
    - derive/[jkl]/5/
    - derive/[mno]/6/
    - derive/[pqrs]/7/
    - derive/[tuv]/8/
    - derive/[wxyz]/9/

translator:
  dictionary: luna_pinyin
  prism: claw_pinyin9
  enable_user_dict: true
  preedit_format:
    - xlit/23456789/23456789/

zh_hans:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: none
