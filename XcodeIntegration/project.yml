name: WeTypeReplica
options:
  bundleIdPrefix: app.lgm.7517
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 15.1
    WT_APP_GROUP_ID: group.7518554
targets:
  WeTypeReplicaApp:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/WeTypeReplicaCore
      - path: ../iOSShared
      - path: ../iOSApp
      - path: ../iOSServices
        excludes:
          - WTKeyboardServiceBinder.swift
    dependencies:
      - target: WeTypeReplicaKeyboard
        embed: true
    info:
      path: Plists/App-Info.plist
    entitlements:
      path: Entitlements/App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WT_HOST_BUNDLE_ID)
  WeTypeReplicaKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ../Sources/WeTypeReplicaCore
      - path: ../iOSShared
      - path: ../iOSOverlay
      - path: ../HamsterBridge
      - path: ../iOSServices
        excludes:
          - WTHostSpeechRecognitionService.swift
      - path: ../iOSExtensions/WTKeyboardInputViewController.swift
    info:
      path: Plists/Keyboard-Info.plist
    entitlements:
      path: Entitlements/Keyboard.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WT_KEYBOARD_BUNDLE_ID)
        APPLICATION_EXTENSION_API_ONLY: YES
  WeTypeReplicaShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../Sources/WeTypeReplicaCore
      - path: ../iOSShared
      - path: ../iOSExtensions/WTQuickSendShareView.swift
      - path: ../iOSExtensions/WTQuickSendShareViewController.swift
      - path: ../iOSServices/WTBonjourTransferService.swift
    info:
      path: Plists/Share-Info.plist
    entitlements:
      path: Entitlements/Share.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WT_SHARE_BUNDLE_ID)
        APPLICATION_EXTENSION_API_ONLY: YES
  WeTypeReplicaWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../iOSShared
      - path: ../iOSExtensions/WTVoiceWidgetView.swift
      - path: ../iOSExtensions/WTWidgetBundle.swift
    info:
      path: Plists/Widget-Info.plist
    entitlements:
      path: Entitlements/Widget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WT_WIDGET_BUNDLE_ID)
        APPLICATION_EXTENSION_API_ONLY: YES

  WeTypeReplicaVoiceActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: ../Sources/WeTypeReplicaCore
      - path: ../iOSShared
      - path: ../iOSExtensions/WTVoiceLiveActivityWidget.swift
    info:
      path: Plists/VoiceActivity-Info.plist
    entitlements:
      path: Entitlements/VoiceActivity.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WT_VOICE_ACTIVITY_BUNDLE_ID)
        APPLICATION_EXTENSION_API_ONLY: YES
