name: Materialize V14 source

on:
  push:
    branches:
      - work/v14-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/v14-ci
      - name: Expand the approved V14 snapshot
        run: |
          cat .v14-upload/part-*.bin > "$RUNNER_TEMP/WeTypeReplicaOverlay_v14-full.zip"
          rm -f WeTypeReplicaOverlay_v14-runtime.zip README.md
          rm -rf .github
          ditto -x -k "$RUNNER_TEMP/WeTypeReplicaOverlay_v14-full.zip" .
          rm -rf .v14-upload
      - name: Commit the complete source tree
        run: |
          git config user.name "Codex Work"
          git config user.email "codex@localhost"
          git add -A
          git commit -m "ci: materialize complete V14 source baseline"
          git push origin HEAD:work/v14-ci
