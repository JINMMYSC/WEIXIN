name: iOS Build and Test
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record toolchain
        run: |
          mkdir -p build
          xcodebuild -version | tee build/toolchain.txt
          sw_vers | tee -a build/toolchain.txt
      - name: Install fixed XcodeGen version
        run: |
          git clone --depth 1 --branch 2.46.0 https://github.com/yonaskolb/XcodeGen.git "$RUNNER_TEMP/XcodeGen"
          cd "$RUNNER_TEMP/XcodeGen"
          swift build -c release --product xcodegen
          echo "$RUNNER_TEMP/XcodeGen/.build/release" >> "$GITHUB_PATH"
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Choose available iPhone simulator
        run: |
          xcrun simctl list devices available --json > build/devices.json
          python3 - <<'PY'
          import json, os
          devices = json.load(open('build/devices.json'))['devices']
          iphones = [d for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith('iPhone') and d.get('isAvailable')]
          if not iphones:
              raise SystemExit('No available iPhone simulator in selected Xcode')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + iphones[0]['udid'] + '\n')
          PY
      - name: Test host and embedded keyboard
        run: |
          set -o pipefail
          xcodebuild test -project WeixinRebuild.xcodeproj -scheme WeixinRebuild -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO | tee build/test.log
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild build -project WeixinRebuild.xcodeproj -scheme WeixinRebuild -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO | tee build/device-build.log
          ditto -c -k --keepParent build/Device/Build/Products/Release-iphoneos/WeixinRebuild.app build/unsigned-device-app.zip
          mkdir -p build/ipa/Payload
          cp -R build/Device/Build/Products/Release-iphoneos/WeixinRebuild.app build/ipa/Payload/
          ditto -c -k --keepParent build/ipa/Payload build/WeixinRebuild-unsigned.ipa
          python3 - <<'PY'
          import plistlib
          import zipfile

          ipa = 'build/WeixinRebuild-unsigned.ipa'
          required = {
              'Payload/WeixinRebuild.app/Info.plist',
              'Payload/WeixinRebuild.app/PlugIns/RebuildKeyboard.appex/Info.plist',
              'Payload/WeixinRebuild.app/PlugIns/RebuildKeyboard.appex/RebuildKeyboard',
          }
          with zipfile.ZipFile(ipa) as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'IPA is missing required entries: {missing}')
              if any(name.startswith('Payload/Payload/') for name in names):
                  raise SystemExit('IPA contains a nested Payload directory')
              app_info = plistlib.loads(archive.read('Payload/WeixinRebuild.app/Info.plist'))
              extension_info = plistlib.loads(archive.read('Payload/WeixinRebuild.app/PlugIns/RebuildKeyboard.appex/Info.plist'))
              if app_info.get('CFBundleIdentifier') != 'com.jinmmysc.weixinrebuild':
                  raise SystemExit('Unexpected application bundle identifier')
              if extension_info.get('CFBundleIdentifier') != 'com.jinmmysc.weixinrebuild.keyboard':
                  raise SystemExit('Unexpected keyboard bundle identifier')
              if extension_info.get('NSExtension', {}).get('NSExtensionPointIdentifier') != 'com.apple.keyboard-service':
                  raise SystemExit('Keyboard extension point identifier is incorrect')
          print('IPA structure and bundle identifiers are valid')
          PY
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-build-${{ github.sha }}
          retention-days: 7
          path: |
            build/*.txt
            build/*.json
            build/*.log
            build/*.zip
            build/*.ipa
            build/*.xcresult
