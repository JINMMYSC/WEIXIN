name: Phase 9 Host Parity CI

on:
  push:
    branches:
      - work/v14-phase9-host-parity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase9-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Run core tests
        run: swift test --parallel
      - name: Build unsigned iOS products
        run: |
          chmod +x ClawBase/ci_build_unsigned.sh ClawBase/ci_prepare_librimekit.sh
          ClawBase/ci_build_unsigned.sh
